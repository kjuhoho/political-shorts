# ---------------------------------------------------------------------------
# 발음 사전 — 왼쪽 표기를 오른쪽 "소리나는 대로"로 치환합니다.
# 레이어 1(voice/normalize.py)이 숫자 읽기 전에 먼저 적용하며, 긴 표기부터
# 매칭합니다. 중립성 원칙(NEUTRALITY.md)에 따라 어느 항목도 특정 진영을
# 부르는 별칭·비하 표현을 넣지 않습니다. 표준 명칭의 '소리'만 고정합니다.
#
# 내 채널만의 항목은 config/voice_lexicon.local.yaml 에 두세요(=git 추적 안 함).
# 같은 키가 있으면 local 파일이 이 파일을 덮어씁니다.
# ---------------------------------------------------------------------------

