name: daily political short

# Runs on GitHub's servers, so it works even when your PC is off.
on:
  # TWO posts a day, always: one in the morning slot (04-14 KST) and one in the evening slot (14-04 KST).
  # GitHub's cron runs 2-5 hours late and sometimes not at all, and it is worst on the hour — so each slot is
  # scheduled several times at odd minutes, and the `gate` job below ends a trigger in seconds when the slot it
  # is actually running in already has its video.
  schedule:
    - cron: "7 21 * * *"     # 06:07 KST  } morning slot
    - cron: "37 22 * * *"    # 07:37 KST  }
    - cron: "7 0 * * *"      # 09:07 KST  }
    - cron: "37 1 * * *"     # 10:37 KST  }
    - cron: "7 7 * * *"      # 16:07 KST  } evening slot
    - cron: "37 8 * * *"     # 17:37 KST  }
    - cron: "7 10 * * *"     # 19:07 KST  }
    - cron: "37 11 * * *"    # 20:37 KST  }
  workflow_dispatch:          # lets you run it by hand from the Actions tab
    inputs:
      publish:
        description: "actually publish (false = build only)"
        type: boolean
        default: true
      focus:
        description: "optional: only make the story whose titles contain these words (e.g. DMZ 영화제 축소)"
        type: string
        default: ""

concurrency:
  group: daily-short
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      skip: ${{ steps.gate.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: python3 scripts/slot_gate.py

  build-and-publish:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 55  # the pipeline now keeps trying candidates until one
                         # is actually publishable (not just "built"), not
                         # just the first one tried — a tough news day can
                         # need several quality_agent rounds per candidate
    permissions:
      contents: write          # to commit the updated DB back

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: restore the research cache (the same story is researched once per two days)
        uses: actions/cache@v4
        with:
          path: data/research_cache
          key: research-${{ github.run_id }}
          restore-keys: |
            research-

      - name: system deps (ffmpeg + Korean fonts)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-nanum
          sudo fc-cache -f

      - name: python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements-publish.txt

      - name: restore config + credentials from secrets
        env:
          PS_ENV_B64: ${{ secrets.PS_ENV_B64 }}
          PS_YT_CLIENT_B64: ${{ secrets.PS_YT_CLIENT_B64 }}
          PS_YT_TOKEN_B64: ${{ secrets.PS_YT_TOKEN_B64 }}
          PS_PEXELS_KEY: ${{ secrets.PS_PEXELS_KEY }}
          PS_GEMINI_KEY: ${{ secrets.PS_GEMINI_KEY }}
          PS_GROQ_KEY: ${{ secrets.PS_GROQ_KEY }}
          PS_OPENAI_KEY: ${{ secrets.PS_OPENAI_KEY }}
          PS_YT_API_KEY: ${{ secrets.PS_YT_API_KEY }}
        run: |
          mkdir -p secrets
          echo "$PS_ENV_B64"        | base64 -d > .env
          echo "$PS_YT_CLIENT_B64"  | base64 -d > secrets/client_secret_youtube.json
          echo "$PS_YT_TOKEN_B64"   | base64 -d > secrets/token_youtube.json
          # Override the Windows-specific values from .env for this Linux runner.
          # (config._resolve() also converts '\' -> '/', but be explicit.)
          {
            echo ""
            echo "FONT_PATH=/usr/share/fonts/truetype/nanum/NanumGothic.ttf"
            echo "FONT_BOLD_PATH=/usr/share/fonts/truetype/nanum/NanumGothicBold.ttf"
            echo "FFMPEG_PATH=ffmpeg"
            echo "YOUTUBE_CLIENT_SECRET_FILE=secrets/client_secret_youtube.json"
            echo "YOUTUBE_TOKEN_FILE=secrets/token_youtube.json"
          } >> .env
          # Optional b-roll video: turns ON automatically when the PS_PEXELS_KEY
          # secret exists (these lines are appended last, so they override the
          # packed .env). No secret -> b-roll stays off, nothing changes.
          if [ -n "$PS_PEXELS_KEY" ]; then
            echo "PEXELS_API_KEY=$PS_PEXELS_KEY" >> .env
            echo "BROLL_ENABLED=true" >> .env
          fi
          # Natural-narration rewrite. Preference: OpenAI (paid, most reliable) ->
          # Groq (FREE, no card, steady) -> Gemini (FREE but flaky). No key at
          # all -> the templated explainer (explain.py) still carries background.
          # Every key that exists is written, so llm.complete() can fall back to
          # the next provider when the preferred one is down or rate-limited.
          [ -n "$PS_OPENAI_KEY" ] && echo "OPENAI_API_KEY=$PS_OPENAI_KEY" >> .env
          [ -n "$PS_GROQ_KEY" ]   && echo "GROQ_API_KEY=$PS_GROQ_KEY" >> .env
          [ -n "$PS_GEMINI_KEY" ] && echo "GEMINI_API_KEY=$PS_GEMINI_KEY" >> .env
          # research stage: YouTube coverage + comments (optional; skipped without the key)
          [ -n "$PS_YT_API_KEY" ]  && echo "YOUTUBE_API_KEY=$PS_YT_API_KEY" >> .env
          if [ -n "$PS_OPENAI_KEY" ]; then
            echo "LLM_PROVIDER=openai" >> .env
          elif [ -n "$PS_GROQ_KEY" ]; then
            echo "LLM_PROVIDER=groq" >> .env
          elif [ -n "$PS_GEMINI_KEY" ]; then
            echo "LLM_PROVIDER=gemini" >> .env
          fi

      - name: seed dedup history from the repo
        run: python scripts/sync_topics.py import

      - name: run pipeline
        env:
          FOCUS: ${{ inputs.focus }}
        run: |
          PUB="--publish"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.publish }}" = "false" ]; then
            PUB="--no-publish"
          fi
          FOCUS_ARG=()
          if [ -n "$FOCUS" ]; then FOCUS_ARG=(--focus "$FOCUS"); fi
          python -m political_shorts run $PUB --max 1 "${FOCUS_ARG[@]}"

      - name: persist dedup history (commit topic_history.json back)
        if: always()
        continue-on-error: true          # housekeeping — must never fail the run
        run: |
          python scripts/sync_topics.py export || true
          git config user.name  "political-shorts bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f data/topic_history.json || true
          if ! git diff --cached --quiet; then
            git commit -m "run: update topic history [skip ci]"
            # other bots push to main too (the longform workflow records its day); a rejected push would lose
            # this slot's record, and the slot gate would then publish the slot a second time
            for i in 1 2 3 4 5; do
              git push && break
              echo "push rejected (attempt $i) - rebasing onto the new main"
              git pull --rebase -X theirs origin main || { git rebase --abort; sleep 5; }
              sleep $((i * 3))
            done
          else
            echo "topic_history.json unchanged — nothing to commit"
          fi

      - name: upload the video as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-${{ github.run_number }}
          path: |
            output/*.mp4
            output/*.meta.json
          if-no-files-found: ignore
          retention-days: 7
