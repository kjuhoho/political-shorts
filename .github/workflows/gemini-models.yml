name: gemini models (diagnostic)

# Manual only. One tiny JSON-mode request per model with PS_GEMINI_KEY, printing the HTTP status, the error (quota /
# not found / overloaded), why generation stopped and how many tokens went to "thinking" — so the model order and
# the thinking setting in llm.py can be matched to what the key really does. Never prints the key (GitHub masks
# secrets) and never builds or publishes a video. Keep `models` short: every model probed is one request of quota.
on:
  workflow_dispatch:
    inputs:
      models:
        description: "comma-separated model ids (blank = llm._GEMINI_MODELS)"
        default: ""
      thinking:
        description: "thinkingLevel to send (blank = none)"
        default: ""

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: probe each model
        env:
          PS_GEMINI_KEY: ${{ secrets.PS_GEMINI_KEY }}
          MODELS: ${{ inputs.models }}
          THINKING: ${{ inputs.thinking }}
        run: |
          if [ -z "$PS_GEMINI_KEY" ]; then echo "PS_GEMINI_KEY not set"; exit 1; fi
          python3 - <<'PY'
          import ast, json, os, urllib.error, urllib.request
          models = [m.strip() for m in os.environ.get("MODELS", "").split(",") if m.strip()]
          if not models:
              src = open("src/political_shorts/llm.py", encoding="utf-8").read()
              start = src.index("_GEMINI_MODELS = [")
              models = ast.literal_eval(src[start + len("_GEMINI_MODELS = "): src.index("]", start) + 1])
          gen = {"maxOutputTokens": 700, "responseMimeType": "application/json"}
          if os.environ.get("THINKING"):
              gen["thinkingConfig"] = {"thinkingLevel": os.environ["THINKING"]}
          body = json.dumps({"contents": [{"parts": [{"text":
              '다음 JSON만 출력: {"score": 0~100 정수, "issues": ["한국 정치 뉴스 대본의 약점 3개, 각 60자 내외"]}'}]}],
              "generationConfig": gen}).encode()
          key = os.environ["PS_GEMINI_KEY"]
          for m in models:
              url = f"https://generativelanguage.googleapis.com/v1beta/models/{m}:generateContent?key={key}"
              req = urllib.request.Request(url, data=body, headers={"Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      d = json.loads(r.read())
                      c = (d.get("candidates") or [{}])[0]
                      text = "".join(p.get("text", "") for p in (c.get("content") or {}).get("parts") or [])
                      try:
                          json.loads(text); parsed = "json ok"
                      except Exception:
                          parsed = "JSON BROKEN"
                      u = d.get("usageMetadata", {})
                      print(f"{m:26s} 200 finish={c.get('finishReason')} thoughts={u.get('thoughtsTokenCount', 0)} "
                            f"answer={u.get('candidatesTokenCount', 0)} {parsed} (serves {d.get('modelVersion', '')})")
              except urllib.error.HTTPError as e:
                  try:
                      err = json.loads(e.read()).get("error", {})
                      det = [{k: v for k, v in x.items() if k in ("violations", "retryDelay")} for x in err.get("details", [])]
                      msg = f"{err.get('status', '')}: {json.dumps([x for x in det if x], ensure_ascii=False)[:500]}"
                  except Exception:
                      msg = ""
                  print(f"{m:26s} {e.code} {msg[:300]}")
          PY
